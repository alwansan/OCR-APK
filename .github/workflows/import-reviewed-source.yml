name: Import reviewed v2.1 source (one-time)
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  import:
    if: github.head_ref == 'feature/ocr-v2-gallery-ux' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/ocr-v2-gallery-ux
          persist-credentials: true
      - name: Decode and validate reviewed source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, json, zlib, hashlib
          blob = Path("bootstrap/source.b64").read_text().strip()
          raw = zlib.decompress(base64.b64decode(blob))
          actual = hashlib.sha256(raw).hexdigest()
          expected = "15cc8ef12046de365144c20f4a2f25e9e7c9d136996f8ad62c4cb0b5b2659fca"
          assert actual == expected, "Source payload integrity mismatch"
          files = json.loads(raw)
          assert len(files) == 53, "Unexpected file count"
          for path, body in files.items():
              target = Path(path)
              assert target.parts and '..' not in target.parts and not target.is_absolute()
              assert not any(p.startswith(".git") for p in target.parts if p != ".github")
              assert not any("keystore" in p.lower() for p in target.parts)
              assert not path.endswith(".jks")
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(body)
          for obsolete in [
              "app/src/main/res/values/styles.xml",
              "app/src/main/java/com/alwansan/crashlogocr/OcrEngine.kt",
              "app/src/main/res/drawable/ic_launcher.xml"
          ]:
              Path(obsolete).unlink(missing_ok=True)
          Path("bootstrap/source.b64").unlink()
          Path(".github/workflows/import-reviewed-source.yml").unlink()
          Path("bootstrap").rmdir()
          print("Imported", len(files), "reviewed source files; checksums verified")
          PY
      - name: Commit source to feature branch only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Import and refine CrashLogOCR v2.1: gallery, long OCR, UX, safe updates"
          git push origin HEAD:refs/heads/feature/ocr-v2-gallery-ux
